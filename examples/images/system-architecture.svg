<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Noto Sans JP, sans-serif" font-size="13">
  <!-- フロント層 -->
  <rect x="30" y="30" width="160" height="60" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="55" text-anchor="middle" font-weight="700" font-size="12">フロント層</text>
  <text x="110" y="73" text-anchor="middle" font-size="10" fill="#555">React 18 + TypeScript</text>

  <!-- API層 -->
  <rect x="220" y="30" width="160" height="60" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="55" text-anchor="middle" font-weight="700" font-size="12">API層</text>
  <text x="300" y="73" text-anchor="middle" font-size="10" fill="#555">Node.js + Express</text>

  <!-- データ層 -->
  <rect x="410" y="30" width="160" height="60" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="55" text-anchor="middle" font-weight="700" font-size="12">データ層</text>
  <text x="490" y="73" text-anchor="middle" font-size="10" fill="#555">PostgreSQL 16</text>

  <!-- 矢印: フロント→API -->
  <line x1="190" y1="60" x2="220" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 矢印: API→データ -->
  <line x1="380" y1="60" x2="410" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ブラウザ -->
  <rect x="30" y="140" width="160" height="50" rx="4" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="110" y="170" text-anchor="middle" font-size="11" fill="#555">Chrome / Edge</text>

  <!-- Redis -->
  <rect x="220" y="140" width="160" height="50" rx="4" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="300" y="170" text-anchor="middle" font-size="11" fill="#555">Redis（セッション）</text>

  <!-- バックアップ -->
  <rect x="410" y="140" width="160" height="50" rx="4" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="490" y="170" text-anchor="middle" font-size="11" fill="#555">日次バックアップ</text>

  <!-- 矢印: ブラウザ→フロント -->
  <line x1="110" y1="140" x2="110" y2="90" stroke="#999" stroke-width="1" marker-end="url(#arrow-gray)"/>
  <!-- 矢印: Redis→API -->
  <line x1="300" y1="140" x2="300" y2="90" stroke="#999" stroke-width="1" marker-end="url(#arrow-gray)"/>
  <!-- 矢印: バックアップ→データ -->
  <line x1="490" y1="140" x2="490" y2="90" stroke="#999" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <!-- ラベル -->
  <text x="135" y="118" text-anchor="middle" font-size="9" fill="#999">HTTPS</text>
  <text x="325" y="118" text-anchor="middle" font-size="9" fill="#999">TCP</text>
  <text x="515" y="118" text-anchor="middle" font-size="9" fill="#999">pg_dump</text>

  <text x="205" y="50" text-anchor="middle" font-size="9" fill="#999">REST API</text>
  <text x="395" y="50" text-anchor="middle" font-size="9" fill="#999">SQL</text>

  <!-- 矢印マーカー定義 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
